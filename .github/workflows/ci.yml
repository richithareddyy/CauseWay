name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Package and dependency check
        run: |
          python -m pip check
          python -c "import importlib, pkgutil, causeway; [importlib.import_module(f'causeway.{m.name}') for m in pkgutil.iter_modules(causeway.__path__)]"
          causeway --help
          causeway env
      - name: Tests
        run: python -m pytest
