# Part I analysis plan: the randomized experiment.
# Encodes docs/design.md Sections 2.2-2.7 and 2.13 (approved 2026-10-09). Written before any Part I
# estimate was computed by the project code.

[meta]
version = "1.0.0"
created = "2026-10-11"
estimand = "intention-to-treat effect of assignment to an e-mail campaign"

[randomness]
base_seed = 20080320
# numpy.random.SeedSequence(entropy=base_seed, spawn_key=(stream,)). One-element keys never collide
# with the benchmark's three-element keys.
bootstrap_stream = 1000
permutation_stream = 1001
classifier_stream = 1002

[[contrasts]]
name = "mens_vs_control"
treatment_arm = "Mens E-Mail"
control_arm = "No E-Mail"
role = "co-primary"

[[contrasts]]
name = "womens_vs_control"
treatment_arm = "Womens E-Mail"
control_arm = "No E-Mail"
role = "co-primary"

[[contrasts]]
name = "mens_vs_womens"
treatment_arm = "Mens E-Mail"
control_arm = "Womens E-Mail"
role = "secondary"

[outcomes]
primary = "spend"
secondary = ["visit", "conversion"]
binary = ["visit", "conversion"]

[inference]
ci_level = 0.95
standard_errors = "HC2 (equals the Neyman variance for a difference in means)"
multiplicity = "holm"
multiplicity_family = "the two co-primary contrasts, within each outcome"
bootstrap_resamples = 5000
bootstrap_scheme = "resample customers with replacement within each arm (arm sizes fixed)"
bootstrap_intervals = ["percentile", "bca"]
permutations = 10000
permutation_statistic = "difference in means, two-sided"
permutation_scheme = "complete randomization within the pair (the trial's procedure is undocumented)"
binary_difference_interval = "newcombe"
binary_ratio_interval = "log"

[regression_adjustment]
method = "Lin (2013): treatment indicators fully interacted with covariates centred on the analysis sample mean"
covariates = ["ln_history", "recency", "mens", "womens", "newbie", "zip_urban", "zip_rural", "channel_web", "channel_multichannel"]
reference_levels = { zip_code = "Suburban", channel = "Phone" }

[diagnostics]
smd_reference = 0.1
classifier = "logistic regression predicting arm from the covariates"
classifier_folds = 5
strata_for_assignment_check = ["history_segment", "recency_band", "channel", "zip_code", "newbie", "mens", "womens"]

[spend_boundary]
observed_maximum_note = "Observed maximum of $499; whether this reflects a true maximum or data-generation constraint is unknown."
near_boundary_bins = [[400.0, 450.0], [450.0, 490.0], [490.0, 499.0]]
